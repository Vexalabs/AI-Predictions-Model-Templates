apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: soccer-prediction-api
spec:
  template:
    spec:
      containers:
      - image: gcr.io/your-gcp-project-id/soccer-prediction-api
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
